<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Odin 已录制数据回放</title>
<style>body{margin:0;background:#11191d;color:#dce8ea;font:15px system-ui,sans-serif}main{max-width:1700px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:18px}strong{color:#65dcc0}h1{font-size:20px;margin:0}small,p{color:#a6b9c1;font-size:13px}.labels{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:12px;background:#202e35}#view{display:block;width:100%;background:black;aspect-ratio:1600/648;object-fit:contain}#view:fullscreen{width:100vw;height:100vh}button,select{background:#243941;border:1px solid #46616c;color:inherit;border-radius:5px;padding:8px 13px;cursor:pointer}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0}#seek{flex:1;min-width:150px}#error{color:#ffad80}#scale{height:10px;max-width:500px;background:linear-gradient(90deg,#30123b,#466be3,#28bbec,#32f298,#a4fc3c,#e3d938,#fe9b2d,#e3440a,#7a0403)}@media(max-width:650px){main{padding:12px}header{align-items:start;flex-direction:column}.labels{font-size:12px}#time{width:100%}}</style>
<main><header><h1><strong>ODIN</strong> 已录制数据回放</h1><small id="dataset"></small></header><div class="labels"><span>RGB · 根据本包 calib.yaml 去畸变</span><span>bag 内记录的深度 · 相机轴向 Z</span></div><img id="view" alt="正在加载回放"><div class="controls"><button id="play">暂停</button><button id="prev">上一帧</button><button id="next">下一帧</button><input id="seek" type="range" min="0" value="0" step="1"><span id="time"></span><select id="speed"><option value="0.25">0.25 倍</option><option value="0.5">0.5 倍</option><option value="1" selected>1 倍</option><option value="2">2 倍</option></select><label><input id="loop" type="checkbox" checked>循环</label><button id="full">全屏</button></div><div id="scale"></div><p>固定深度量程：0.2 m（近）— 3.0 m（远），黑色为无有效深度。显示缩小至一半，每个 2×2 区域保留最近实测点，无深度补洞。</p><p id="details"></p><p id="error"></p></main>
<script>
const $=id=>document.getElementById(id);let frames=[],duration=0,index=0,playing=true,clock=0,last=performance.now(),pending=false;
function show(i){index=Math.max(0,Math.min(frames.length-1,i));const f=frames[index];$('view').src=f.file;$('seek').value=index;$('time').textContent=`${f.time.toFixed(1)} / ${duration.toFixed(1)} 秒 · ${index+1}/${frames.length} 帧`;$('details').textContent=`点云/深度时间戳 ${f.stamp.toFixed(6)} · RGB 配对时间差 ${f.rgb_dt_ms.toFixed(2)} ms${f.rgb_valid?'':' · 本帧 RGB 未匹配'}`;window.replayState={index,playing,frames:frames.length,duration};for(let n=1;n<=3;n++)if(frames[index+n]){const image=new Image();image.src=frames[index+n].file}}
function pause(){playing=false;$('play').textContent='播放';show(index)}
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放';if(playing&&index===frames.length-1)clock=0;last=performance.now();show(index)};
$('prev').onclick=()=>{pause();show(index-1);clock=frames[index].time};$('next').onclick=()=>{pause();show(index+1);clock=frames[index].time};$('seek').oninput=()=>{show(Number($('seek').value));clock=frames[index].time;last=performance.now()};$('full').onclick=()=>$('view').requestFullscreen();
function tick(now){const delta=(now-last)/1000;last=now;if(playing&&frames.length){clock+=delta*Number($('speed').value);if(clock>duration){if($('loop').checked)clock=0;else{clock=duration;pause()}}let next=index;if(clock<frames[index].time)next=0;while(next+1<frames.length&&frames[next+1].time<=clock)next++;if(next!==index)show(next)}requestAnimationFrame(tick)}
fetch('manifest.json').then(r=>r.json()).then(d=>{frames=d.frames;duration=d.duration;$('dataset').textContent=d.dataset;$('seek').max=frames.length-1;show(0);last=performance.now();requestAnimationFrame(tick)}).catch(e=>$('error').textContent=e.message);
$('view').onerror=()=>$('error').textContent='回放帧加载失败，请检查回放服务。';
</script></html>
